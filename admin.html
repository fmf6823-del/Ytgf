<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Visitor Log</title>
<style>
  :root{color-scheme:dark}
  body{font-family:monospace;padding:16px;background:#111;color:#eee;margin:0}
  h2{font-family:Arial,sans-serif;margin:0 0 12px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border:1px solid #333;padding:6px;text-align:left;vertical-align:top;word-break:break-word}
  th{background:#222;position:sticky;top:0}
  tr:hover td{background:#1a1a1a}
  button,input,select{padding:8px 12px;font-size:14px;background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:4px}
  button{cursor:pointer}
  .wrap{overflow-x:auto;max-height:70vh}
  #status{color:#999;font-size:13px;margin-bottom:10px}
  .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px}
  .tag.link{background:#1a7f37}
  .tag.image{background:#7f1a5e}
  .tag.consent{background:#555}
  .mono{font-family:monospace;color:#8cf}
  a{color:#6cf}
</style>
</head>
<body>
  <h2>Visitor Log</h2>
  <div class="bar">
    <input id="key" type="password" placeholder="Admin key">
    <button id="save">Save key</button>
    <button id="refresh">Refresh</button>
    <select id="filter">
      <option value="">All types</option>
      <option value="link">Links only</option>
      <option value="image">Images only</option>
      <option value="consent">Consent page only</option>
    </select>
  </div>
  <div id="status"></div>
  <div class="wrap">
    <table id="t">
      <thead>
        <tr>
          <th>Time</th><th>Type</th><th>Target / Link ID</th>
          <th>IP</th><th>Location</th><th>Device</th><th>Referer</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
var keyInput = document.getElementById('key');
keyInput.value = localStorage.getItem('adminKey') || '';
var allRows = [];

document.getElementById('save').onclick = function () {
  localStorage.setItem('adminKey', keyInput.value);
  load();
};
document.getElementById('refresh').onclick = load;
document.getElementById('filter').onchange = render;

function classify(row) {
  if (row.target === '[image view]') return 'image';
  if (row.linkId) return 'link';
  return 'consent';
}

function render() {
  var tb = document.querySelector('#t tbody');
  var filter = document.getElementById('filter').value;
  tb.innerHTML = '';
  var rows = allRows.filter(function(r){ return !filter || classify(r) === filter; });
  if (rows.length === 0) {
    tb.innerHTML = '<tr><td colspan="7">No records.</td></tr>';
    return;
  }
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var type = classify(row);
    var tr = document.createElement('tr');

    var tdTime = document.createElement('td');
    tdTime.textContent = row.time || '';

    var tdType = document.createElement('td');
    var tag = document.createElement('span');
    tag.className = 'tag ' + type;
    tag.textContent = type;
    tdType.appendChild(tag);

    var tdTarget = document.createElement('td');
    if (row.target && row.target !== '[image view]') {
      var a = document.createElement('a');
      a.href = row.target; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = row.target.length > 48 ? row.target.slice(0,48)+'…' : row.target;
      tdTarget.appendChild(a);
      tdTarget.appendChild(document.createElement('br'));
    }
    if (row.linkId) {
      var code = document.createElement('span');
      code.className = 'mono';
      code.textContent = '#' + row.linkId;
      tdTarget.appendChild(code);
    }
    if (!tdTarget.textContent) tdTarget.textContent = '—';

    var tdIp = document.createElement('td');
    if (row.ip && row.ip !== 'unknown') {
      var ipA = document.createElement('a');
      ipA.href = 'https://ipinfo.io/' + encodeURIComponent(row.ip);
      ipA.target = '_blank'; ipA.rel = 'noopener';
      ipA.textContent = row.ip;
      tdIp.appendChild(ipA);
    } else { tdIp.textContent = row.ip || ''; }

    var tdLoc = document.createElement('td');
    var parts = [row.city, row.region, row.country].filter(Boolean);
    tdLoc.textContent = parts.join(', ') || '—';
    if (parts.length) {
      var mapA = document.createElement('a');
      mapA.href = 'https://www.google.com/maps/search/' +
        encodeURIComponent(parts.join(', '));
      mapA.target = '_blank'; mapA.rel = 'noopener';
      mapA.textContent = ' 📍';
      tdLoc.appendChild(mapA);
    }

    var tdDev = document.createElement('td');
    tdDev.textContent = (row.device || '').slice(0, 80);

    var tdRef = document.createElement('td');
    tdRef.textContent = row.referer || '—';

    tr.appendChild(tdTime); tr.appendChild(tdType); tr.appendChild(tdTarget);
    tr.appendChild(tdIp); tr.appendChild(tdLoc); tr.appendChild(tdDev);
    tr.appendChild(tdRef);
    tb.appendChild(tr);
  }
}

async function load() {
  var status = document.getElementById('status');
  status.textContent = 'Loading...';
  try {
    var r = await fetch('/.netlify/functions/list', {
      headers: { 'x-admin-key': keyInput.value || '' }
    });
    if (r.status === 401) {
      status.textContent = 'Wrong or missing admin key.';
      allRows = []; render(); return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    allRows = await r.json();
    if (!Array.isArray(allRows)) allRows = [];
    status.textContent = allRows.length + ' record(s).';
    render();
  } catch (e) {
    status.textContent = 'Error loading log: ' + e.message;
  }
}

load();
</script>
</body>
</html>
